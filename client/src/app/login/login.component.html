<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <h1>Travel Booking Portal</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your email" [(ngModel)]="email" name="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" [(ngModel)]="password" name="password" />
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit">Log in</button>
  </form>
</div>
